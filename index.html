<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GodWorld — عالم الآلهة</title>
<style>
:root{--bg:#10151b;--panel:#182029;--panel2:#202a34;--ink:#f5ecd9;--muted:#a9b2ad;--gold:#e8bd62;--line:#394653}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--ink)}
#game{position:fixed;inset:0;touch-action:none;background:#0d1217}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;align-items:center}.brand,.stat,.hint{background:rgba(20,27,34,.92);border:1px solid #43515e;box-shadow:0 8px 25px #0007;border-radius:14px;backdrop-filter:blur(8px)}.brand{padding:9px 13px;font-weight:800}.brand small{display:block;color:var(--muted);font-weight:500;font-size:10px;margin-top:2px}.stats{display:flex;gap:7px}.stat{padding:7px 10px;font-size:12px}.stat b{color:var(--gold)}
#panel{pointer-events:auto;position:absolute;right:10px;top:86px;width:min(330px,calc(100vw - 20px));max-height:calc(100vh - 170px);overflow:auto;background:rgba(22,29,36,.96);border:1px solid #43515e;border-radius:18px;box-shadow:0 18px 50px #0009;padding:12px;transform:translateX(120%);transition:.25s ease}#panel.open{transform:translateX(0)}#panel h2{font-size:16px;margin:0 0 4px}.sub{color:var(--muted);font-size:11px;margin-bottom:10px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{position:relative;min-height:124px;padding:10px;border:1px solid #44515d;border-radius:15px;background:linear-gradient(145deg,#27323c,#171e25);cursor:pointer;overflow:hidden;box-shadow:inset 0 1px #ffffff12,0 7px 16px #0004}.card:active{transform:scale(.98)}.card.selected{border-color:var(--gold);box-shadow:0 0 0 2px #e8bd6240,0 10px 22px #0006}.art{width:52px;height:52px;border-radius:14px;background:#111820;border:1px solid #4b5864;display:grid;place-items:center;font-size:31px;margin-bottom:7px}.card b{display:block;font-size:13px}.card span{display:block;color:#b9c1bc;font-size:10px;margin-top:3px}.tag{display:inline-block;margin-top:6px;padding:3px 6px;border-radius:8px;background:#ffffff0b;color:#dbc487;font-size:9px}
#bottom{pointer-events:auto;position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}button{border:1px solid #465560;background:#1b242c;color:var(--ink);border-radius:13px;padding:11px 13px;font-weight:700;box-shadow:0 6px 16px #0006;cursor:pointer}button.primary{background:#6e5523;border-color:#d6ab55}button:active{transform:translateY(1px)}#toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%) translateY(15px);opacity:0;transition:.2s;background:#172027eF;border:1px solid #596875;border-radius:12px;padding:9px 13px;font-size:12px;white-space:nowrap}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#inspect{position:absolute;left:10px;top:86px;width:min(260px,calc(100vw - 20px));background:#141b22ee;border:1px solid #43515e;border-radius:16px;padding:11px;display:none;pointer-events:auto}#inspect.show{display:block}.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ffffff0b;font-size:11px}.row:last-child{border:0}.row em{color:#e2c474;font-style:normal}@media(max-width:650px){.stats .stat:nth-child(n+3){display:none}.brand{font-size:12px}.cards{grid-template-columns:1fr 1fr}#panel{top:70px}}
</style></head><body><div id="game"></div><div id="hud"><div class="top"><div class="brand">🌍 GodWorld<small>عالم حيّ • أنت الإله</small></div><div class="stats"><div class="stat">السكان <b id="pop">0</b></div><div class="stat">ممالك <b id="kingdoms">0</b></div><div class="stat">موارد <b id="res">0</b></div></div></div><div id="panel"><h2>مكتبة الحياة</h2><div class="sub">اختر بطاقة واحدة ثم المس الخريطة لوضعها. لا توجد نقاط مزعجة — أنت تصنع العالم.</div><div class="cards" id="cards"></div></div><div id="inspect"><b id="ititle">المكان</b><div class="row"><span>البيئة</span><em id="ienv">—</em></div><div class="row"><span>السكان</span><em id="ipop">—</em></div><div class="row"><span>المورد</span><em id="ires">—</em></div></div><div id="toast"></div><div id="bottom"><button id="library" class="primary">🃏 بطاقات الحياة</button><button id="reset">↻ عالم جديد</button><button id="help">⌕ تعليمات</button></div></div>
<script>
const cvs=document.createElement('canvas'),ctx=cvs.getContext('2d');document.getElementById('game').appendChild(cvs);let W=innerWidth,H=innerHeight,DPR=Math.min(2,devicePixelRatio||1);function resize(){W=innerWidth;H=innerHeight;cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const TILE=24,COLS=90,ROWS=60;const species=[{id:'human',n:'البشر',icon:'🧑',bio:'متكيفون • بناة • تجار',pref:'سهول / أنهار',env:['grass','forest','sand','snow']},{id:'elf',n:'الجان',icon:'🧝',bio:'حماة الغابات • رماة',pref:'غابات / أنهار',env:['forest','grass']},{id:'dwarf',n:'الأقزام',icon:'⛏️',bio:'تعدين • صناعة • جبال',pref:'جبال / صخر',env:['mountain','grass']},{id:'orc',n:'الأورك',icon:'👹',bio:'محاربون • أقوياء',pref:'مرتفعات / سهول',env:['grass','mountain','sand']},{id:'halfling',n:'الهوبيت',icon:'🧑‍🌾',bio:'زراعة • قرى مزدهرة',pref:'سهول خضراء',env:['grass','forest']},{id:'nomad',n:'البدو',icon:'🐎',bio:'رحّل • سفر • تجارة',pref:'صحارى / سهول',env:['sand','grass']},{id:'merfolk',n:'شعب البحر',icon:'🧜',bio:'بحريون • صيد • جزر',pref:'سواحل / مياه',env:['water']},{id:'draconid',n:'أبناء التنين',icon:'🐉',bio:'نادرون • قوة • آثار',pref:'جبال / بركان',env:['mountain','sand']}];const animals=[['🐺','ذئب'],['🦌','غزال'],['🐘','فيل'],['🐻','دب'],['🐊','تمساح'],['🦅','نسر'],['🐎','حصان'],['🐑','خروف']];let terrain=[],settlers=[],resources=[],structures=[],selected=null,cam={x:0,y:0,z:1},drag=null,pinch=null,last=performance.now();function rng(a,b){return Math.random()*(b-a)+a}function rint(a,b){return Math.floor(rng(a,b+1))}function key(x,y){return y*COLS+x}function generate(){terrain=new Array(COLS*ROWS);settlers=[];resources=[];structures=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let nx=(x-COLS/2)/(COLS/2),ny=(y-ROWS/2)/(ROWS/2),d=Math.sqrt(nx*nx*.85+ny*ny),n=Math.sin(x*.22)+Math.cos(y*.18)+Math.sin((x+y)*.09),t=d<.72?'grass':d<.86?'sand':'water';if(t!=='water'&&n>1.55)t='mountain';else if(t==='grass'&&n>.75)t='forest';terrain[key(x,y)]=t}for(let i=0;i<7;i++){let cx=rint(8,COLS-9),cy=rint(7,ROWS-8);for(let y=cy-5;y<=cy+5;y++)for(let x=cx-7;x<=cx+7;x++)if(x>=0&&y>=0&&x<COLS&&y<ROWS&&Math.hypot((x-cx)*.8,y-cy)<rint(3,6))terrain[key(x,y)]=Math.random()<.2?'forest':'grass'}for(let i=0;i<190;i++){let x=rint(3,COLS-4),y=rint(3,ROWS-4);if(terrain[key(x,y)]==='grass')terrain[key(x,y)]='forest'}for(let i=0;i<130;i++){let x=rint(2,COLS-3),y=rint(2,ROWS-3),t=terrain[key(x,y)];if(['forest','mountain','grass'].includes(t))resources.push({x,y,type:t==='mountain'?'ore':t==='forest'?'wood':'berry'})}for(let i=0;i<22;i++){let x=rint(5,COLS-6),y=rint(5,ROWS-6);if(terrain[key(x,y)]!=='water')structures.push({x,y,type:'ruin'})}for(let i=0;i<70;i++){let x=rint(4,COLS-5),y=rint(4,ROWS-5);if(['forest','grass'].includes(terrain[key(x,y)])){let a=animals[rint(0,animals.length-1)];settlers.push({x:x+.5,y:y+.5,animal:a[0],name:a[1],kind:'animal'})}}for(let i=0;i<4;i++){let x=rint(20,COLS-21),y=rint(14,ROWS-15);if(terrain[key(x,y)]!=='water')placeSpecies(species[i],x,y,true)}center()}function center(){cam.x=(COLS*TILE*cam.z-W)/2;cam.y=(ROWS*TILE*cam.z-H)/2;cam.x=Math.max(0,cam.x);cam.y=Math.max(0,cam.y)}function envName(t){return{grass:'مروج',forest:'غابة',sand:'صحراء',mountain:'جبال',water:'مياه'}[t]||t}function placeSpecies(s,gx,gy,starter=false){let t=terrain[key(gx,gy)];if(t==='water'&&s.id!=='merfolk'){if(!starter)toast('هذا الجنس لا يستطيع الاستقرار في الماء هنا');return false}let adapt=s.env.includes(t)?1:.65,count=rint(7,15),base={x:gx+.5,y:gy+.5,species:s.id,name:s.n,kind:'species',pop:count,adapt,age:0};settlers.push(base);structures.push({x:gx,y:gy,type:'village',species:s.id});if(!starter)toast(`${s.n} وصلوا إلى ${envName(t)} — التكيف يبدأ عبر الأجيال`);selected=null;return true}function worldToScreen(x,y){return{x:x*TILE*cam.z-cam.x,y:y*TILE*cam.z-cam.y}}function screenToWorld(sx,sy){return{x:(sx+cam.x)/(TILE*cam.z),y:(sy+cam.y)/(TILE*cam.z)}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b1116';ctx.fillRect(0,0,W,H);let z=cam.z,minX=Math.max(0,Math.floor(cam.x/(TILE*z))-2),maxX=Math.min(COLS,Math.ceil((cam.x+W)/(TILE*z))+2),minY=Math.max(0,Math.floor(cam.y/(TILE*z))-2),maxY=Math.min(ROWS,Math.ceil((cam.y+H)/(TILE*z))+2);for(let y=minY;y<maxY;y++)for(let x=minX;x<maxX;x++){let t=terrain[key(x,y)],p=worldToScreen(x,y),s=TILE*z;ctx.fillStyle={water:'#2a5c70',sand:'#c4a15d',grass:'#52734b',forest:'#3f6546',mountain:'#666b69'}[t];ctx.fillRect(p.x,p.y,s+1,s+1);if(t==='forest'){ctx.fillStyle='#24402f';ctx.beginPath();ctx.arc(p.x+s*.5,p.y+s*.42,s*.30,0,7);ctx.fill();ctx.fillStyle='#6f8d56';ctx.fillRect(p.x+s*.46,p.y+s*.48,s*.08,s*.33)}if(t==='mountain'){ctx.fillStyle='#858987';ctx.beginPath();ctx.moveTo(p.x+s*.15,p.y+s*.8);ctx.lineTo(p.x+s*.52,p.y+s*.18);ctx.lineTo(p.x+s*.88,p.y+s*.8);ctx.fill();ctx.fillStyle='#d0d0c5';ctx.beginPath();ctx.moveTo(p.x+s*.39,p.y+s*.39);ctx.lineTo(p.x+s*.52,p.y+s*.18);ctx.lineTo(p.x+s*.65,p.y+s*.39);ctx.fill()}}resources.forEach(r=>{let p=worldToScreen(r.x+.5,r.y+.5);if(p.x>-20&&p.y>-20&&p.x<W+20&&p.y<H+20){ctx.font=`${Math.max(10,14*z)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(r.type==='ore'?'💎':r.type==='wood'?'🪵':'🫐',p.x,p.y+7*z)}});structures.forEach(o=>{let p=worldToScreen(o.x+.5,o.y+.5),s=TILE*z;if(o.type==='ruin'){ctx.font=`${Math.max(12,18*z)}px sans-serif`;ctx.textAlign='center';ctx.fillText('🏛️',p.x,p.y)}else{ctx.fillStyle='#b88848';ctx.fillRect(p.x-s*.22,p.y-s*.2,s*.44,s*.36);ctx.fillStyle='#d8b56a';ctx.beginPath();ctx.moveTo(p.x-s*.3,p.y-s*.2);ctx.lineTo(p.x,p.y-s*.46);ctx.lineTo(p.x+s*.3,p.y-s*.2);ctx.fill()}});settlers.forEach(c=>{let p=worldToScreen(c.x,c.y);if(p.x<-30||p.y<-30||p.x>W+30||p.y>H+30)return;ctx.font=`${Math.max(11,19*z)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';let icon=c.kind==='animal'?c.animal:species.find(s=>s.id===c.species)?.icon||'•';ctx.fillText(icon,p.x,p.y);if(c.kind==='species'){ctx.font=`${Math.max(8,10*z)}px sans-serif`;ctx.fillStyle='#f6e9c8';ctx.fillText(c.pop,p.x,p.y+Math.max(10,15*z))}});document.getElementById('pop').textContent=Math.floor(settlers.filter(s=>s.kind==='species').reduce((a,b)=>a+b.pop,0));document.getElementById('kingdoms').textContent=structures.filter(s=>s.type==='village').length;document.getElementById('res').textContent=resources.length}function zoomAt(factor,sx,sy){let before=screenToWorld(sx,sy);cam.z=Math.max(.55,Math.min(3.2,cam.z*factor));let after=screenToWorld(sx,sy);cam.x+=(after.x-before.x)*TILE*cam.z;cam.y+=(after.y-before.y)*TILE*cam.z;clamp()}function clamp(){cam.x=Math.max(0,Math.min(COLS*TILE*cam.z-W,cam.x));cam.y=Math.max(0,Math.min(ROWS*TILE*cam.z-H,cam.y))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}function buildCards(){let el=document.getElementById('cards');el.innerHTML=species.map(s=>`<div class="card" data-id="${s.id}"><div class="art">${s.icon}</div><b>${s.n}</b><span>${s.bio}</span><span>البيئة: ${s.pref}</span><span class="tag">تكيف تلقائي</span></div>`).join('');el.querySelectorAll('.card').forEach(c=>c.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');selected=species.find(s=>s.id===c.dataset.id);toast(`اخترت بطاقة ${selected.n} — المس الخريطة لوضعها`)})}cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);if(e.isPrimary)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false}});cvs.addEventListener('pointermove',e=>{if(drag&&e.isPrimary){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;cam.x=drag.cx-dx;cam.y=drag.cy-dy;clamp()}});cvs.addEventListener('pointerup',e=>{if(drag&&e.isPrimary){if(!drag.moved){let w=screenToWorld(e.clientX,e.clientY),x=Math.floor(w.x),y=Math.floor(w.y);if(selected)placeSpecies(selected,x,y);else inspect(x,y)}drag=null}});cvs.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});let pointers=new Map();cvs.addEventListener('pointerdown',e=>pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}));cvs.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(!pinch)pinch={d,cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2};else{zoomAt(d/pinch.d,pinch.cx,pinch.cy);pinch.d=d}}});['pointerup','pointercancel'].forEach(ev=>cvs.addEventListener(ev,e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=null}));function inspect(x,y){if(x<0||y<0||x>=COLS||y>=ROWS)return;let t=terrain[key(x,y)],near=settlers.filter(s=>Math.floor(s.x)===x&&Math.floor(s.y)===y),rs=resources.find(r=>r.x===x&&r.y===y);document.getElementById('ititle').textContent=`${envName(t)} • ${x},${y}`;document.getElementById('ienv').textContent=envName(t);document.getElementById('ipop').textContent=near.reduce((a,b)=>a+(b.pop||0),0)||'—';document.getElementById('ires').textContent=rs?(rs.type==='ore'?'خام':rs.type==='wood'?'خشب':'غذاء'):'—';document.getElementById('inspect').classList.add('show')}document.getElementById('library').onclick=()=>document.getElementById('panel').classList.toggle('open');document.getElementById('reset').onclick=()=>{generate();toast('تم إنشاء عالم جديد مليء بالحياة')};document.getElementById('help').onclick=()=>toast('اسحب الخريطة • قرّب بإصبعين • اختر بطاقة ثم المس الأرض');buildCards();generate();function loop(t){let dt=Math.min(.1,(t-last)/1000);last=t;settlers.forEach(s=>{if(s.kind==='species'){s.age+=dt;if(s.age>3){s.age=0;s.pop=Math.max(2,Math.round(s.pop*(1+(s.adapt?.08:.04))))}}});draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
