<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GodWorld</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#081015;color:#f5ead4;font-family:system-ui,Tahoma,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:start;gap:8px}.box,.btn,.card{background:#172129eF;border:1px solid #52616b;box-shadow:0 8px 24px #0008;border-radius:14px}.brand{padding:9px 12px}.brand b{font-size:16px}.brand small{display:block;color:#aab3ae;font-size:9px}.stats{display:flex;gap:5px}.stat{min-width:57px;padding:6px 8px;text-align:center}.stat small{display:block;color:#aab3ae;font-size:8px}.stat b{color:#e5bd65;font-size:13px}.bottom{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:center;gap:7px;pointer-events:auto}.btn{color:#f5ead4;padding:10px 12px;font-weight:800}.gold{background:#735625;border-color:#dcb65f}.library{position:absolute;right:10px;top:70px;width:min(360px,calc(100vw - 20px));max-height:calc(100vh - 140px);overflow:auto;padding:12px;pointer-events:auto;display:none}.library.show{display:block}.head{display:flex;justify-content:space-between}.head h2{margin:0;font-size:17px}.head p{margin:3px 0 10px;color:#aab3ae;font-size:10px}.close{border:0;background:none;color:white;font-size:25px}.tabs{display:flex;gap:5px;margin-bottom:8px}.tab{flex:1;padding:8px;border-radius:9px;background:#202b34;color:#ddd;border:1px solid #4b5860}.tab.active{border-color:#e1b75b;color:#f0cb7a}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{padding:8px;text-align:right;color:#f5ead4;cursor:pointer}.card.selected{border-color:#e1b75b;box-shadow:0 0 0 2px #e1b75b33}.icon{height:50px;width:50px;border-radius:12px;background:#0d151a;border:1px solid #53636d;display:grid;place-items:center;font-size:28px;margin-bottom:5px}.card b{display:block;font-size:12px}.card small{display:block;color:#adb6b2;font-size:9px;line-height:1.4}.tag{display:inline-block;margin-top:5px;font-size:8px;color:#e0bd70;background:#e0bd7018;padding:3px 5px;border-radius:6px}.hint{position:absolute;left:50%;bottom:62px;transform:translate(-50%,10px);opacity:0;background:#172229ee;border:1px solid #52616b;border-radius:10px;padding:8px 12px;font-size:10px;transition:.2s;white-space:nowrap}.hint.on{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.stats .stat:nth-child(n+4){display:none}.bottom .btn{padding:9px 10px;font-size:12px}}</style></head><body><canvas id="game"></canvas><div class="ui"><div class="top"><div class="box brand"><b>🌍 GodWorld</b><small>عالم حيّ • أنت الإله</small></div><div class="stats"><div class="box stat"><small>السكان</small><b id="pop">0</b></div><div class="box stat"><small>الممالك</small><b id="king">0</b></div><div class="box stat"><small>الموارد</small><b id="res">0</b></div><div class="box stat"><small>السنة</small><b id="year">1</b></div></div></div><div id="lib" class="box library"><div class="head"><div><h2>🃏 مكتبة الحياة</h2><p>اختر بطاقة ثم المس الخريطة. لا توجد نقاط تقييم؛ البيئة هي التي تغيّر الصفات.</p></div><button id="close" class="close">×</button></div><div class="tabs"><button id="raceTab" class="tab active">الأجناس</button><button id="animalTab" class="tab">الحيوانات</button></div><div id="cards" class="cards"></div></div><div id="hint" class="hint"></div><div class="bottom"><button id="cardsBtn" class="btn gold">🃏 بطاقات الحياة</button><button id="newBtn" class="btn">✦ عالم جديد</button><button id="helpBtn" class="btn">؟ التحكم</button></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1);function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const races=[['human','البشر','♙','بناة وتجار','grass forest sand'],['elf','الجان','♕','حماة الغابات','forest grass'],['dwarf','الأقزام','♜','تعدين وصناعة','mountain grass'],['orc','الأورك','♞','محاربون أقوياء','grass mountain sand'],['halfling','الهوبيت','♟','زراعة وقرى','grass forest'],['nomad','البدو','♘','رحّل وتجارة','sand grass'],['merfolk','شعب البحر','♜','صيد وملاحة','water'],['draconid','أبناء التنين','♛','قوة وآثار','mountain sand']];
const animals=[['wolf','ذئب','🐺','forest grass'],['deer','غزال','🦌','grass forest'],['bear','دب','🐻','forest mountain'],['elephant','فيل','🐘','grass sand'],['eagle','نسر','🦅','mountain forest'],['horse','حصان','🐎','grass sand'],['croc','تمساح','🐊','water sand'],['sheep','خروف','🐑','grass']];
const cols={water:'#255b72',grass:'#4f754c',forest:'#315b3e',sand:'#b89b5c',mountain:'#69706e'},bn={water:'مياه',grass:'مروج',forest:'غابات',sand:'صحراء',mountain:'جبال'};const C=20,COLS=110,ROWS=70;let terrain=[],resources=[],objects=[],units=[],selected=null,kind='race',year=1,cam={x:0,y:0,z:1},pointers=new Map(),lastPin=0,drag=null;
function B(x,y){return terrain[y*COLS+x]}function generate(){terrain=[];resources=[];objects=[];units=[];year=1;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let dx=(x-COLS/2)/(COLS/2),dy=(y-ROWS/2)/(ROWS/2),d=Math.hypot(dx*.9,dy),n=Math.sin(x*.22)+Math.cos(y*.19)+Math.sin((x+y)*.11);let b=d>.9?'water':d>.77?'sand':'grass';if(b!=='water'&&n>1)b='forest';if(b!=='water'&&n>1.65)b='mountain';terrain.push(b)}for(let i=0;i<240;i++){let x=2+Math.random()*(COLS-4)|0,y=2+Math.random()*(ROWS-4)|0,b=B(x,y);if(b!=='water')resources.push({x,y,t:b==='forest'?'wood':b==='mountain'?'ore':'food'})}for(let i=0;i<35;i++){let x=4+Math.random()*(COLS-8)|0,y=4+Math.random()*(ROWS-8)|0;if(B(x,y)!=='water')objects.push({x,y,t:'ruin'})}for(let i=0;i<90;i++){let a=animals[Math.random()*animals.length|0],x=4+Math.random()*(COLS-8)|0,y=4+Math.random()*(ROWS-8)|0;if(a[3].includes(B(x,y)))units.push({x:x+.5,y:y+.5,type:'animal',icon:a[2],life:1})}for(let i=0;i<6;i++){let r=races[i],p=find(r[3].split(' '));spawnRace(r[0],p.x,p.y,true)}center();toast('العالم حيّ وجاهز')}
function find(pre){for(let i=0;i<800;i++){let x=6+Math.random()*(COLS-12)|0,y=6+Math.random()*(ROWS-12)|0;if(pre.includes(B(x,y)))return{x,y}}return{x:COLS>>1,y:ROWS>>1}}
function spawnRace(id,x,y,silent){let r=races.find(a=>a[0]===id),b=B(x,y);if(b==='water'&&id!=='merfolk'){if(!silent)toast('هذا الجنس لا يستطيع بدء مستوطنة هنا');return false}units.push({x:x+.5,y:y+.5,type:'race',id,pop:10+Math.random()*10|0,adapt:r[3].split(' ').includes(b)?1:.6,t:0});objects.push({x,y,t:'village',id});objects.push({x:x+1,y,t:'farm'});if(!silent)toast('تم وضع '+r[1]+' في '+bn[b]);return true}
function center(){cam.z=Math.min(1.5,W/(COLS*C*.92),H/(ROWS*C*.92));cam.x=(COLS*C*cam.z-W)/2;cam.y=(ROWS*C*cam.z-H)/2;clamp()}function clamp(){cam.x=Math.max(0,Math.min(COLS*C*cam.z-W,cam.x));cam.y=Math.max(0,Math.min(ROWS*C*cam.z-H,cam.y))}function screen(x,y){return{x:x*C*cam.z-cam.x,y:y*C*cam.z-cam.y}}function world(sx,sy){return{x:(sx+cam.x)/(C*cam.z),y:(sy+cam.y)/(C*cam.z)}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#071015';ctx.fillRect(0,0,W,H);let z=cam.z,s=C*z,x0=Math.max(0,Math.floor(cam.x/(C*z))-2),x1=Math.min(COLS,Math.ceil((cam.x+W)/(C*z))+2),y0=Math.max(0,Math.floor(cam.y/(C*z))-2),y1=Math.min(ROWS,Math.ceil((cam.y+H)/(C*z))+2);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let p=screen(x,y),b=B(x,y);ctx.fillStyle=cols[b];ctx.fillRect(p.x,p.y,s+1,s+1);if(b==='forest'){ctx.fillStyle='#1d432d';ctx.beginPath();ctx.arc(p.x+s*.5,p.y+s*.42,s*.28,0,7);ctx.fill();ctx.fillStyle='#76553b';ctx.fillRect(p.x+s*.46,p.y+s*.47,s*.08,s*.32)}if(b==='mountain'){ctx.fillStyle='#868b88';ctx.beginPath();ctx.moveTo(p.x+s*.12,p.y+s*.86);ctx.lineTo(p.x+s*.52,p.y+s*.1);ctx.lineTo(p.x+s*.92,p.y+s*.86);ctx.fill();ctx.fillStyle='#d7d4c7';ctx.beginPath();ctx.moveTo(p.x+s*.4,p.y+s*.35);ctx.lineTo(p.x+s*.52,p.y+s*.1);ctx.lineTo(p.x+s*.65,p.y+s*.35);ctx.fill()}}resources.forEach(r=>{let p=screen(r.x+.5,r.y+.5);ctx.fillStyle=r.t==='ore'?'#d7dde0':r.t==='wood'?'#7b573c':'#e2b34d';ctx.fillRect(p.x-2,p.y-2,4,4)});objects.forEach(o=>{let p=screen(o.x+.5,o.y+.5),s=C*z;if(o.t==='ruin'){ctx.strokeStyle='#d0bd88';ctx.lineWidth=2;ctx.strokeRect(p.x-s*.25,p.y-s*.25,s*.5,s*.5)}else if(o.t==='farm'){ctx.fillStyle='#8d6840';for(let i=-5;i<=5;i+=3)ctx.fillRect(p.x+i*z,p.y-4*z,2*z,8*z)}else{ctx.fillStyle='#a87540';ctx.fillRect(p.x-s*.24,p.y-s*.17,s*.48,s*.32);ctx.fillStyle='#e0b96e';ctx.beginPath();ctx.moveTo(p.x-s*.3,p.y-s*.17);ctx.lineTo(p.x,p.y-s*.43);ctx.lineTo(p.x+s*.3,p.y-s*.17);ctx.fill()}});units.forEach(u=>{let p=screen(u.x,u.y),s=C*z;if(u.type==='animal'){ctx.font=`${Math.max(12,15*z)}px serif`;ctx.textAlign='center';ctx.fillText(u.icon,p.x,p.y)}else{let cc={human:'#d8c49b',elf:'#7ebc95',dwarf:'#b5a39a',orc:'#aa6550',halfling:'#c9a66b',nomad:'#aa875e',merfolk:'#6da9ba',draconid:'#b87d4d'}[u.id];ctx.fillStyle=cc;ctx.beginPath();ctx.arc(p.x,p.y-4*z,5*z,0,7);ctx.fill();ctx.fillStyle='#30383a';ctx.fillRect(p.x-3*z,p.y+2*z,6*z,7*z);if(z>.9){ctx.fillStyle='#f1e1bd';ctx.font=`${8*z}px sans-serif`;ctx.fillText(Math.floor(u.pop),p.x,p.y+17*z)}}})}
function renderCards(){let arr=kind==='race'?races:animals;document.getElementById('cards').innerHTML=arr.map(a=>`<button class="card ${selected?.id===a[0]?'selected':''}" data-id="${a[0]}"><div class="icon">${a[2]}</div><b>${a[1]}</b><small>${a[3]}</small><span class="tag">${kind==='race'?'تكيف بيئي':'سلوك بري'}</span></button>`).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{let a=arr.find(v=>v[0]===b.dataset.id);selected=a;document.getElementById('lib').classList.remove('show');toast('اخترت '+a[1]+' — المس الخريطة');renderCards()})}
function tap(sx,sy){let w=world(sx,sy),x=Math.floor(w.x/C),y=Math.floor(w.y/C);if(x<0||y<0||x>=COLS||y>=ROWS)return;if(selected&&kind==='race'){spawnRace(selected[0],x,y,false);selected=null;renderCards()}else if(selected&&kind==='animal'){let a=animals.find(v=>v[0]===selected[0]);units.push({x:x+.5,y:y+.5,type:'animal',icon:a[2],life:1});selected=null;document.getElementById('lib').classList.remove('show');renderCards();toast('تم إطلاق '+a[1])}}
function dist(){let a=[...pointers.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}function mid(){let a=[...pointers.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}function zoom(f,sx,sy){let before=world(sx,sy);cam.z=Math.max(.55,Math.min(3,cam.z*f));let after=world(sx,sy);cam.x+=(after.x-before.x)*C*cam.z;cam.y+=(after.y-before.y)*C*cam.z;clamp()}
canvas.onpointerdown=e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};if(pointers.size===2)lastPin=dist()};canvas.onpointermove=e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let d=dist();if(lastPin)zoom(d/lastPin,mid().x,mid().y);lastPin=d}else if(drag&&pointers.size===1){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>7)drag.moved=true;cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;clamp()}};canvas.onpointerup=e=>{if(drag&&!drag.moved&&pointers.size===1)tap(e.clientX,e.clientY);pointers.delete(e.pointerId);if(pointers.size<2)lastPin=0;drag=null};canvas.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)};
function toast(t){let h=document.getElementById('hint');h.textContent=t;h.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>h.classList.remove('on'),1700)}document.getElementById('cardsBtn').onclick=()=>document.getElementById('lib').classList.add('show');document.getElementById('close').onclick=()=>document.getElementById('lib').classList.remove('show');document.getElementById('newBtn').onclick=generate;document.getElementById('helpBtn').onclick=()=>toast('اسحب بإصبع واحد • إصبعان للتكبير • اختر بطاقة ثم المس الأرض');document.getElementById('raceTab').onclick=()=>{kind='race';raceTab.classList.add('active');animalTab.classList.remove('active');renderCards()};document.getElementById('animalTab').onclick=()=>{kind='animal';animalTab.classList.add('active');raceTab.classList.remove('active');renderCards()};
let last=performance.now();function loop(t){let dt=Math.min(.1,(t-last)/1000);last=t;year+=dt*.16;units.forEach(u=>{if(u.type==='race'){u.t+=dt;if(u.t>3){u.t=0;u.adapt=Math.min(1,u.adapt+.025);u.pop=Math.max(1,Math.round(u.pop*(1+.012*u.adapt)))}}});document.getElementById('pop').textContent=Math.floor(units.filter(u=>u.type==='race').reduce((n,u)=>n+u.pop,0));document.getElementById('king').textContent=objects.filter(o=>o.t==='village').length;document.getElementById('res').textContent=resources.length;document.getElementById('year').textContent=Math.floor(year);draw();requestAnimationFrame(loop)}generate();renderCards();requestAnimationFrame(loop);
</script></body></html>
