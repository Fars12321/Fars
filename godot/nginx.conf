server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.wasm$ {
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(pck|js|png|svg|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
